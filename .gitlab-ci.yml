# നമ്മുടെ പൈപ്പ്‌ലൈനിലെ പ്രധാന ഘട്ടങ്ങൾ (Stages)
stages:
  - test

# ടെസ്റ്റ് റൺ ചെയ്യുന്ന ജോബ്
run_appium_tests:
  stage: test
  # പൈത്തണും ആവശ്യമായ ടൂളുകളും ഉള്ള ഇമേജ്
  image: python:3.10

  script:
    - echo "Appium Automation Test Pipeline Starting..."
    - pip install --upgrade pip
    - pip install Appium-Python-Client pytest
    - echo "Dependencies installed successfully!"
    - echo "Running Appium tests..."
    - pytest || true
    - echo "Pipeline finished!"